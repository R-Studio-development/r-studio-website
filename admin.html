<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | R Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-container { max-width: 1200px; margin: 120px auto 60px; padding: 0 20px; }
        .login-box { background: var(--bg-lighter); padding: 40px; border-radius: 20px; border: 1px solid var(--border-color); max-width: 400px; margin: 0 auto; text-align: center; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-family: inherit; }
        .login-box input:focus { outline: none; border-color: var(--gold); }
        .reviews-table { width: 100%; background: var(--bg-lighter); border-radius: 20px; border: 1px solid var(--border-color); overflow: hidden; margin-top: 30px; border-collapse: collapse; }
        .reviews-table th, .reviews-table td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border-color); }
        .reviews-table th { background: var(--bg-color); color: var(--gold); font-weight: 600; }
        .reviews-table tr:last-child td { border-bottom: none; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; }
        .status-approved { background: rgba(40, 167, 69, 0.2); color: #28a745; }
        .status-pending { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .action-btn { padding: 6px 14px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85rem; margin: 2px 3px; transition: 0.3s; display: inline-block; text-decoration: none; }
        .btn-approve { background: #28a745; color: white; }
        .btn-approve:hover { background: #218838; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #128C7E; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- فرم ورود -->
        <div id="loginSection" class="login-box">
            <h2 style="margin-bottom: 20px;">ورود به <span style="color: var(--gold);">پنل مدیریت</span></h2>
            <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید">
            <button class="btn" style="width: 100%;" onclick="login()">ورود</button>
            <p id="loginError" style="color: #dc3545; margin-top: 15px; display: none;">رمز عبور اشتباه است!</p>
        </div>

        <!-- بخش مدیریت -->
        <div id="adminSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>پنل <span style="color: var(--gold);">مدیریت</span></h2>
                <button class="btn btn-outline" onclick="logout()">خروج</button>
            </div>
                        <div class="admin-tabs" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn" id="tabReviews" onclick="switchTab('reviews')">نظرات</button>
                <button class="btn btn-outline" id="tabMessages" onclick="switchTab('messages')">پیام‌های تماس</button>
                <button class="btn btn-outline" id="tabPortfolio" onclick="switchTab('portfolio')">نمونه‌کارها</button>
            </div>
            <div id="reviewsContainer">
                <p style="text-align: center; color: var(--text-muted);">در حال بارگذاری...</p>
            </div>
            <div id="messagesContainer" class="hidden">
                <p style="text-align: center; color: var(--text-muted);">در حال بارگذاری...</p>
            </div>
            <div id="portfolioContainer" class="hidden">
                <!-- فرم افزودن پروژه جدید -->
                <div style="background: var(--bg-lighter); padding: 30px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 30px;">
                    <h3 style="color: var(--gold); margin-bottom: 20px;">افزودن پروژه جدید</h3>
                    <form id="addPortfolioForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="text" name="title" placeholder="عنوان پروژه (مثلاً: خانه آر)" required style="padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit;">
                        <input type="text" name="live_url" placeholder="لینک سایت زنده" required style="padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit;">
                        <input type="text" name="image_url" placeholder="آدرس تصویر (مثلاً: assets/img/project.jpg)" required style="padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit;">
                        <input type="text" name="tags" placeholder="تگ‌ها (با کاما جدا کنید: ووکامرس,وردپرس)" style="padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit;">
                        <textarea name="description" placeholder="توضیح کوتاه (برای صفحه اصلی)" required style="grid-column: 1 / -1; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit; min-height: 60px;"></textarea>
                        <textarea name="challenge" placeholder="چالش (برای صفحه نمونه‌کارها)" style="grid-column: 1 / -1; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit; min-height: 60px;"></textarea>
                        <textarea name="solution" placeholder="راه‌حل (برای صفحه نمونه‌کارها)" style="grid-column: 1 / -1; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit; min-height: 60px;"></textarea>
                        <textarea name="result" placeholder="نتیجه (برای صفحه نمونه‌کارها)" style="grid-column: 1 / -1; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: inherit; min-height: 60px;"></textarea>
                        <button type="submit" class="btn" style="grid-column: 1 / -1;">افزودن پروژه</button>
                    </form>
                </div>

                <!-- جدول پروژه‌ها -->
                <div id="portfolioTableContainer">
                    <p style="text-align: center; color: var(--text-muted);">در حال بارگذاری...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminPassword = '';

        function login() {
            const pass = document.getElementById('adminPassword').value;
            if (!pass) return;

            adminPassword = pass;
            fetch('/api/admin-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => {
                if (res.ok) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('adminSection').classList.remove('hidden');
                    loadReviews();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            })
            .catch(() => {
                document.getElementById('loginError').style.display = 'block';
            });
        }

        function logout() {
            adminPassword = '';
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminSection').classList.add('hidden');
        }

        function loadReviews() {
            fetch('/api/admin-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword })
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('reviewsContainer');
                if (!data.reviews || data.reviews.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">هیچ نظری وجود ندارد.</p>';
                    return;
                }

                let html = '<table class="reviews-table"><thead><tr><th>نام</th><th>کسب‌وکار</th><th>نظر</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';
                data.reviews.forEach(r => {
                    const status = r.approved == 1 
                        ? '<span class="status-badge status-approved">تأیید شده</span>' 
                        : '<span class="status-badge status-pending">در انتظار</span>';
                    
                    const approveBtn = r.approved == 1 
                        ? '' 
                        : `<button class="action-btn btn-approve" onclick="updateReview(${r.id}, 1)">تأیید</button>`;
                    
                    html += `<tr>
                        <td>${r.name}</td>
                        <td>${r.business || '-'}</td>
                        <td>${r.review}</td>
                        <td>${status}</td>
                        <td>${approveBtn}<button class="action-btn btn-delete" onclick="updateReview(${r.id}, -1)">حذف</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('reviewsContainer').innerHTML = '<p style="color: #dc3545;">خطا در بارگذاری نظرات.</p>';
            });
        }

        function updateReview(id, action) {
            if (action === -1 && !confirm('آیا از حذف این نظر مطمئن هستید؟')) return;
            
            fetch('/api/admin-update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword, id: id, action: action })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadReviews();
                } else {
                    alert('خطا: ' + (data.error || 'نامشخص'));
                }
            })
            .catch(err => alert('خطای شبکه'));
        }

        function switchTab(tab) {
            // مخفی کردن همه
            document.getElementById('reviewsContainer').classList.add('hidden');
            document.getElementById('messagesContainer').classList.add('hidden');
            document.getElementById('portfolioContainer').classList.add('hidden');
            
            // ریست کردن کلاس دکمه‌ها
            document.getElementById('tabReviews').className = 'btn btn-outline';
            document.getElementById('tabMessages').className = 'btn btn-outline';
            document.getElementById('tabPortfolio').className = 'btn btn-outline';
            
            // نمایش تب انتخاب شده
            if (tab === 'reviews') {
                document.getElementById('reviewsContainer').classList.remove('hidden');
                document.getElementById('tabReviews').className = 'btn';
                loadReviews();
            } else if (tab === 'messages') {
                document.getElementById('messagesContainer').classList.remove('hidden');
                document.getElementById('tabMessages').className = 'btn';
                loadMessages();
            } else if (tab === 'portfolio') {
                document.getElementById('portfolioContainer').classList.remove('hidden');
                document.getElementById('tabPortfolio').className = 'btn';
                loadPortfolio();
            }
        }

        function loadMessages() {
            fetch('/api/contact-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword })
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('messagesContainer');
                if (!data.messages || data.messages.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">هیچ پیامی وجود ندارد.</p>';
                    return;
                }

                let html = '<table class="reviews-table"><thead><tr><th>نام</th><th>شماره تماس</th><th>ایمیل</th><th>موضوع</th><th>پیام</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>';
                data.messages.forEach(m => {
                    const status = m.is_read == 1 
                        ? '<span class="status-badge status-approved">خوانده شده</span>' 
                        : '<span class="status-badge status-pending">جدید</span>';
                    
                    const readBtn = m.is_read == 1 
                        ? '' 
                        : `<button class="action-btn btn-approve" onclick="updateMessage(${m.id}, 'read')">علامت خوانده‌شده</button>`;
                    
                    // دکمه واتساپ
                    const waNumber = m.phone ? m.phone.replace(/^0/, '98') : '';
                    const waBtn = waNumber 
                        ? `<a href="https://wa.me/${waNumber}?text=سلام ${m.name} عزیز، در پاسخ به پیام شما در سایت R Studio..." target="_blank" class="action-btn btn-whatsapp">واتساپ</a>`
                        : '';
                    
                    const emailDisplay = m.email ? m.email : '-';
                    
                    html += `<tr>
                        <td>${m.name}</td>
                        <td>${m.phone || '-'}</td>
                        <td>${emailDisplay}</td>
                        <td>${m.subject || '-'}</td>
                        <td>${m.message}</td>
                        <td>${status}</td>
                        <td>${readBtn}${waBtn}<button class="action-btn btn-delete" onclick="updateMessage(${m.id}, 'delete')">حذف</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('messagesContainer').innerHTML = '<p style="color: #dc3545;">خطا در بارگذاری پیام‌ها.</p>';
            });
        }

        function updateMessage(id, action) {
            if (action === 'delete' && !confirm('آیا از حذف این پیام مطمئن هستید؟')) return;
            
            fetch('/api/contact-update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword, id: id, action: action })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadMessages();
                } else {
                    alert('خطا: ' + (data.error || 'نامشخص'));
                }
            })
            .catch(err => alert('خطای شبکه'));
        }

                // ===== PORTFOLIO MANAGEMENT =====
        function loadPortfolio() {
            fetch('/api/portfolio-admin-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword })
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('portfolioTableContainer');
                if (!data.portfolio || data.portfolio.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">هیچ پروژه‌ای وجود ندارد.</p>';
                    return;
                }

                let html = '<table class="reviews-table"><thead><tr><th>عنوان</th><th>توضیح</th><th>لینک</th><th>عملیات</th></tr></thead><tbody>';
                data.portfolio.forEach(p => {
                    html += `<tr>
                        <td>${p.title}</td>
                        <td>${p.description}</td>
                        <td><a href="${p.live_url}" target="_blank" style="color: var(--gold);">مشاهده</a></td>
                        <td><button class="action-btn btn-delete" onclick="deletePortfolio(${p.id})">حذف</button></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('portfolioTableContainer').innerHTML = '<p style="color: #dc3545;">خطا در بارگذاری پروژه‌ها.</p>';
            });
        }

        function deletePortfolio(id) {
            if (!confirm('آیا از حذف این پروژه مطمئن هستید؟')) return;
            
            fetch('/api/portfolio-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPassword, id: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadPortfolio();
                } else {
                    alert('خطا: ' + (data.error || 'نامشخص'));
                }
            })
            .catch(err => alert('خطای شبکه'));
        }

        // فرم افزودن پروژه
        document.getElementById('addPortfolioForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            data.password = adminPassword;
            
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'در حال افزودن...';
            btn.disabled = true;
            
            fetch('/api/portfolio-add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    this.reset();
                    loadPortfolio();
                    btn.textContent = '✓ اضافه شد';
                    setTimeout(() => { btn.textContent = originalText; btn.disabled = false; }, 2000);
                } else {
                    alert('خطا: ' + (result.error || 'نامشخص'));
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert('خطای شبکه');
                btn.textContent = originalText;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
