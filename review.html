<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نظر | R Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo"><img src="assets/img/logo-gold.png" alt="R Studio"></a>
            <ul class="nav-links">
                <li><a href="index.html">خانه</a></li>
                <li><a href="portfolio.html">نمونه‌کارها</a></li>
                <li><a href="services.html">خدمات</a></li>
                <li><a href="about.html">درباره من</a></li>
                <li><a href="contact.html">تماس</a></li>
            </ul>
            <button class="hamburger"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <section style="margin-top: 120px; margin-bottom: 80px;">
        <div class="container">
            <h2 class="section-title">ثبت <span>نظر</span></h2>
            <p class="section-subtitle">نظر شما پس از تأیید، در صفحه اصلی نمایش داده می‌شود</p>
            
            <div style="max-width: 600px; margin: 0 auto; background: var(--bg-lighter); padding: 40px; border-radius: 20px; border: 1px solid var(--border-color);">
                                <form id="reviewForm" class="contact-form">
                    <input type="text" name="name" placeholder="نام و نام خانوادگی" required>
                    <input type="text" name="business" placeholder="نام کسب‌وکار یا وب‌سایت (مثلاً: خانه آر)" required>
                    <textarea name="review" placeholder="نظر خود را بنویسید..." required minlength="10"></textarea>
                    
                    <div class="cf-turnstile" data-sitekey="YOUR_SITE_KEY" data-theme="dark" data-size="flexible" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>
                    
                    <button type="submit" class="btn" style="width: 100%;">ارسال نظر</button>
                </form>
                <div id="formMessage" style="margin-top: 20px; text-align: center; display: none;"></div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <img src="assets/img/logo-gold.png" alt="R Studio" class="footer-logo">
            <p>&copy; ۲۰۲۴ R Studio | تمامی حقوق محفوظ است.</p>
        </div>
    </footer>

    <script>
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            const msg = document.getElementById('formMessage');
            const originalText = btn.textContent;
            
            btn.textContent = 'در حال ارسال...';
            btn.disabled = true;
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    msg.style.display = 'block';
                    msg.style.color = '#28a745';
                    msg.textContent = '✓ نظر شما با موفقیت ثبت شد و پس از تأیید نمایش داده می‌شود.';
                    form.reset();
                    if (window.turnstile) window.turnstile.reset();
                } else {
                    throw new Error(result.error || 'خطا در ارسال');
                }
            } catch (error) {
                msg.style.display = 'block';
                msg.style.color = '#dc3545';
                msg.textContent = 'خطا: ' + error.message;
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
